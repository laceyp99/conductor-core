name: Dependency compatibility

on:
  schedule:
    - cron: "00 12 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-compatible:
    name: Latest compatible dependencies (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.16"
      - name: Resolve newest compatible dependencies
        run: uv lock --upgrade
      - name: Sync fresh environment
        run: uv sync --locked --all-extras --python ${{ matrix.python-version }}
      - name: Test
        run: uv run --locked --all-extras --python ${{ matrix.python-version }} pytest -q
