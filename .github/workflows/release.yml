name: Release

# Tags every new version that main declares in pyproject.toml. Patch versions
# only get a tag; minor and major versions also get a GitHub release whose notes
# combine the matching CHANGELOG.md section with the patches since the last one.

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release
  queue: max
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Publish release for new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists; nothing to release."
            exit 0
          fi
          # Prints "patch" or "release"; only releases get a notes file.
          kind=$(python - "$version" <<'PY'
          import sys
          sys.path.insert(0, ".github/scripts")
          from release_check import is_patch, release_notes, section_body
          text = open("CHANGELOG.md", encoding="utf-8").read()
          version = sys.argv[1]
          if is_patch(version):
              if not (section_body(text, version) or "").strip():
                  sys.exit(f"CHANGELOG.md has no [{version}] section")
              print("patch")
          else:
              with open("release-notes.md", "w", encoding="utf-8") as notes:
                  notes.write(release_notes(text, version))
              print("release")
          PY
          )
          if [ "${kind}" = "patch" ]; then
            git tag "${tag}" "${GITHUB_SHA}"
            git push origin "refs/tags/${tag}"
            echo "Tagged patch ${tag}; release pages are published for minor and major versions."
            exit 0
          fi
          gh release create "${tag}" --target "${GITHUB_SHA}" \
            --title "Conductor Core ${tag}" --notes-file release-notes.md
