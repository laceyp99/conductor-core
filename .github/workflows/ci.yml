name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A newer push to a pull request replaces its in-progress run. Each push to
# main gets its own group, so every main commit keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  locked-tests:
    name: Locked tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked --all-extras --python ${{ matrix.python-version }}
      - name: Test
        run: uv run --locked --all-extras --python ${{ matrix.python-version }} pytest -q

  quality-build:
    name: Quality and package build (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked --all-extras --python 3.12
      - name: Ruff format
        run: uv run --locked --all-extras --python 3.12 ruff format --check .
      - name: Ruff lint
        run: uv run --locked --all-extras --python 3.12 ruff check .
      - name: Ty source baseline
        run: uv run --locked --all-extras --python 3.12 ty check
      - name: Test
        run: uv run --locked --all-extras --python 3.12 pytest -q
      - name: Build
        run: uv build --clear
      - name: Check installed-wheel typing
        run: uv run --locked --all-extras --python 3.12 python scripts/check_wheel_typing.py
      - name: Test built wheel as a pip consumer
        run: |
          uv venv --seed --python 3.12 .venv-consumer
          .venv-consumer/bin/python -m pip install --upgrade pip
          .venv-consumer/bin/python -m pip install dist/conductor_core-*.whl
          .venv-consumer/bin/python -m pip check
          .venv-consumer/bin/python -I tests/installed_package_smoke.py
      - name: Build documentation
        run: uv run --locked --group docs --python 3.12 mkdocs build --strict

  minimal-install:
    name: Minimal install (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
      - name: Create fresh environment
        run: uv venv --python 3.11 .venv-minimal
      - name: Install bare package and test dependency
        run: uv pip install --python .venv-minimal/bin/python -e . "pytest>=9.0.3,<10"
      - name: Verify optional dependencies are absent
        run: >-
          .venv-minimal/bin/python -c "from importlib.util import find_spec; optional = ('anthropic', 'google', 'midi2audio', 'ollama', 'openai', 'pydub'); installed = [name for name in optional if find_spec(name) is not None]; assert not installed, f'optional dependencies unexpectedly installed: {installed}'"
      # Modules that need a provider SDK skip themselves with importorskip, so
      # new test modules run here by default.
      - name: Test import boundary and core behavior
        run: .venv-minimal/bin/python -m pytest -q

  windows-storage:
    name: Storage security (Windows, Python 3.12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked --all-extras --python 3.12
      - name: Verify escaping directory symlinks are exercised
        shell: pwsh
        run: |
          $test = "tests/test_history.py::test_store_rejects_generation_symlink_that_escapes_root"
          $output = uv run --locked --all-extras --python 3.12 pytest -q $test -rA 2>&1 | Tee-Object -Variable pytestOutput
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ($pytestOutput -match "SKIPPED") {
            throw "The Windows directory-symlink security test was skipped."
          }
      - name: Test Windows storage behavior
        run: uv run --locked --all-extras --python 3.12 pytest -q tests/test_history.py tests/test_paths.py
