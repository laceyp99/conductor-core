name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  known-good:
    name: Known-good dependencies (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install known-good dependencies
        env:
          PIP_BUILD_CONSTRAINT: requirements/ci-known-good.txt
        run: python -m pip install --upgrade -c requirements/ci-known-good.txt pip build && python -m pip install -c requirements/ci-known-good.txt -e ".[providers,playback,dev]"
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Ruff lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -q
      - name: Build
        env:
          PIP_BUILD_CONSTRAINT: requirements/ci-known-good.txt
        run: python -m build
      - name: Test built wheel as a consumer
        run: |
          python -m venv .venv-consumer
          .venv-consumer/bin/python -m pip install --upgrade pip
          .venv-consumer/bin/python -m pip install dist/conductor_core-*.whl
          .venv-consumer/bin/python -m pip check
          .venv-consumer/bin/python -I tests/installed_package_smoke.py

  minimal-install:
    name: Minimal install (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Create fresh environment
        run: python -m venv .venv-minimal
      - name: Install bare package and test dependency
        run: .venv-minimal/bin/python -m pip install --upgrade pip && .venv-minimal/bin/python -m pip install -e . "pytest>=8.3,<9"
      - name: Verify optional dependencies are absent
        run: >-
          .venv-minimal/bin/python -c "from importlib.util import find_spec; optional = ('anthropic', 'google', 'midi2audio', 'ollama', 'openai', 'pydub'); installed = [name for name in optional if find_spec(name) is not None]; assert not installed, f'optional dependencies unexpectedly installed: {installed}'"
      - name: Test import boundary and core behavior
        run: >-
          .venv-minimal/bin/python -m pytest -q
          tests/test_import_boundary.py
          tests/test_audio.py
          tests/test_engine.py
          tests/test_example_scripts.py
          tests/test_history.py
          tests/test_midi_processing.py
          tests/test_objects.py
          tests/test_paths.py
          tests/test_runs.py
          tests/test_utils.py

  latest-compatible:
    name: Latest compatible dependencies (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install latest compatible dependencies
        run: python -m pip install --upgrade pip build && python -m pip install --upgrade --upgrade-strategy eager -e ".[providers,playback,dev]"
      - name: Test
        run: python -m pytest -q

  windows-storage:
    name: Storage security (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest
      - name: Verify escaping directory symlinks are exercised
        shell: pwsh
        run: |
          $test = "tests/test_history.py::test_store_rejects_generation_symlink_that_escapes_root"
          $output = python -m pytest -q $test -rA 2>&1 | Tee-Object -Variable pytestOutput
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ($pytestOutput -match "SKIPPED") {
            throw "The Windows directory-symlink security test was skipped."
          }
      - name: Test Windows storage behavior
        run: python -m pytest -q tests/test_history.py tests/test_paths.py
