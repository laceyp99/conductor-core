[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conductor-core"
version = "0.4.0"
description = "Reusable prompt-to-MIDI loop generation engine for Conductor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"mido>=1.3.3,<2",
	"pydantic>=2.11.4,<3",
]

[project.optional-dependencies]
openai = ["openai>=1.79.0"]
anthropic = ["anthropic>=0.115.0"]
google = ["google-genai>=1.65.0"]
ollama = ["ollama>=0.6.1"]
playback = [
	"audioop-lts>=0.2.2,<1; python_version >= '3.13'",
	"pydub>=0.25.1,<1",
]
providers = [
	"anthropic>=0.115.0",
	"google-genai>=1.65.0",
	"ollama>=0.6.1",
	"openai>=1.79.0",
]

[dependency-groups]
dev = [
	"pytest>=9.0.3,<10",
	"ruff>=0.16,<0.17",
	"ty>=0.0.69,<0.1",
]

[tool.uv]
required-version = ">=0.11.16"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
conductor_core = [
	"resources/model_list.json",
	"resources/prompts/loop_gen.txt",
	"resources/soundfonts/*.sf2",
	"resources/soundfonts/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
	"A",
	"ASYNC",
	"B",
	"C4",
	"E4",
	"E7",
	"E9",
	"F",
	"FLY",
	"FURB",
	"I",
	"NPY",
	"PERF",
	"PGH",
	"PIE",
	"PT",
	"RET",
	"RSE",
	"RUF",
	"SIM",
	"UP",
	"W605",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/test_audio.py" = ["A002"]
